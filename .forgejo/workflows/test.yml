# 顺手发现 #6（v3.1.1 功能增强报告）：最小 CI——flutter analyze + flutter test。
#
# 说明：
# - 刻意只挂 workflow_dispatch（手动触发）：仓库镜像到 Forgejo / Gitee / GitLab /
#   GitHub 多站，自动 CI 若在无 Flutter 环境的 runner 上必红，会成为持续的噪音源；
#   手动档由维护者自选时机在 Forgejo 网页上点「Run workflow」执行。
# - 前置条件：Forgejo 实例已启用 Actions，且至少有一个 runner 能拉取
#   ghcr.io/cirruslabs/flutter 镜像（Docker container 模式）。
# - 若要改为 push 自动触发：把 `on:` 块加回 `push:`（branches: [master]）即可。
name: test

on:
  workflow_dispatch:

jobs:
  analyze-and-test:
    runs-on: docker
    container:
      image: ghcr.io/cirruslabs/flutter:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Pub get
        run: flutter pub get
      - name: Analyze（零 error 门槛）
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Test（全量回归，--no-pub 避免改写 pubspec.lock）
        run: flutter test --no-pub
