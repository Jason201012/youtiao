# 顺手发现 #6（v3.1.1 功能增强报告）：最小 CI——flutter analyze + flutter test。
#
# 说明：
# - P3-10（v3.1.2 审计）：在手动档基础上补 **push 触发 + 每日定时**——
#   「只在发版当天手动跑一次绿」会让问题长期潜伏（本轮月报用例在每月
#   1–2 日必挂即是实例：手动档不可能恰好在那天跑）。push 档只对 master
#   生效，避免多站镜像的无关分支刷屏；定时档每天 03:20 UTC（北京 11:20）
#   跑一次，兼顾「发版当天没 push 也要有回归信号」。
# - 仍保留 workflow_dispatch 手动入口。若 runner 资源紧张，可把 push 档
#   收窄为 paths 过滤（lib/ test/ pubspec.yaml）。
# - 前置条件：Forgejo 实例已启用 Actions，且至少有一个 runner 能拉取
#   ghcr.io/cirruslabs/flutter 镜像（Docker container 模式）。
#
# v3.1.4（2026-11-07）：**关掉自动触发，只保留手动入口**。
# 本实例至今未注册任何 Actions runner（GET /api/v1/repos/rootnas/youtiao/actions/runners
# 返回 []）。push / schedule 触发的 job 因等不到 `docker` 标签的 runner 永远停在
# waiting，最终被回收为 cancelled；Forgejo 会把 cancelled 记为
# commit status = failure（context "test / analyze-and-test (push)"，
# description "Has been cancelled"），于是**每一次提交**在提交列表里都挂红 ✗
# ——v3.1.3 的 c81ff88 / d168056 两条即实例，与代码质量毫无关系，且会误导
# 发版核验。runner 未就绪时创建 run 只会制造噪音，故先不自动创建。
#
# 恢复方法：在 NAS 注册一个带 `docker` 标签的 act_runner 后，把下面 on.push /
# on.schedule 两段注释放开即可（job 定义无需改动）。历史失败状态是既往记录，
# 不因本次修改而消失；新提交不再产生失败状态。
name: test

on:
  workflow_dispatch:
  # push:
  #   branches: [master]
  #   paths:
  #     - 'lib/**'
  #     - 'test/**'
  #     - 'pubspec.yaml'
  #     - '.forgejo/workflows/test.yml'
  # schedule:
  #   # 每天 03:20 UTC（Forgejo Actions 依据 cron；北京时区 11:20）。
  #   - cron: '20 3 * * *'

jobs:
  analyze-and-test:
    runs-on: docker
    container:
      image: ghcr.io/cirruslabs/flutter:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Pub get
        run: flutter pub get
      - name: Analyze（零 error 门槛）
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Test（全量回归，--no-pub 避免改写 pubspec.lock）
        run: flutter test --no-pub
