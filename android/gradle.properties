org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -Djava.io.tmpdir=D:/workbuddy/.gradle/tmp
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# 关闭 Kotlin 增量编译：项目在 D 盘、pub 缓存在 C 盘，跨盘导致增量缓存
# 写相对路径时抛 "different roots"，编译插件（shared_preferences_android 等）失败。
kotlin.incremental=false
kotlin.compiler.incremental=false
# 关闭 Gradle 构建缓存：Gradle 9.1 默认开启 caching，缓存易残留重复 dex，
# 导致 mergeProjectDexDebug 报 "Type androidx.lifecycle.viewmodel.savedstate.R
# is defined multiple times"。关掉后每次重新编译，避免该问题复发。
org.gradle.caching=false
# 让 Kotlin 编译器在 Gradle 守护进程内（in-process）编译，而非启动独立的 Kotlin 守护进程。
# 独立的 Kotlin 守护进程会把编译产物缓存到 GRADLE_USER_HOME（本机在 C 盘），增量复用到 D 盘
# 的 build 输出时跨卷写成符号链接，被 Gradle 9.1 的新快照机制拒绝
# （"Cannot snapshot ... MainActivity.class: not a regular file"）。
# in-process 模式没有独立守护进程缓存，配合下方 kotlin.incremental=false 每次重新编译、
# 直接写出普通文件，从根上消除跨卷符号链接。编译会略慢但稳定。
kotlin.compiler.execution.strategy=in-process
# 放宽 Gradle 9 对「Java 与 Kotlin 任务 JVM 目标不一致」的严格校验（error→warning）。
# dynamic_color 等插件的 Java 目标为 1.8、Kotlin 目标为 17，Gradle 9.1 默认会直接编译失败；
# 改为 warning 后插件照常编译（其 bytecode 在 Android 运行时正常），规避构建中断。
kotlin.jvm.target.validation.mode=warning
# 临时：禁用守护进程，让 Gradle 前台运行并继承完整 shell 环境（排错 compileFlutterBuildDebug 用）
org.gradle.daemon=false
