name: todolist
description: Material 3 TodoList 应用（设计稿 1:1 还原）
publish_to: 'none'
version: 2.1.9+40

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: ^6.1.1
  shared_preferences: ^2.3.0
  material_symbols_icons: ^4.0.0
  flutter_local_notifications: ^17.2.0
  intl: ^0.20.2
  timezone: ^0.9.4
  path_provider: ^2.1.5
  file_picker: ^8.1.0
  share_plus: ^10.0.3
  package_info_plus: ^9.0.1
  http: ^1.2.0
  url_launcher: ^6.3.0
  just_audio: ^0.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/audio/

# 启动图标配置：会按 Android/iOS 各尺寸自动生成 mipmap/AppIcon。
# 源文件放在 assets/icon/；其中 foreground.png 是透明底的徽标+勾，
# background.png 是蓝色渐变，用于 Android 自适应图标。
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "assets/icon/background.png"
  adaptive_icon_foreground: "assets/icon/foreground.png"
